name: 'Run tests'

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            ./coverage
            junit.xml
          key: ${{ format('test-{0}', hashFiles('package.json', 'pnpm-lock.yaml', 'vitest.config.ts', 'private/test/**/*.ts', '**/*.spec.*')) }}

      - uses: pnpm/setup@v3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cache: true
          require-lockfile: true

      - name: 'Run tests'
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        #language=bash
        run: |
          pnpm vitest run --coverage

      - uses: ./codecov-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: ./codecov-test-results
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
