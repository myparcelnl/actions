name: 'Setup PDK'
description: 'Setup @myparcel-pdk/app-builder'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        cache: true
        require-lockfile: true

    - name: 'Check if nx is present'
      id: nx
      shell: bash
      #language=bash
      run: pnpm exec nx --version
      continue-on-error: true

    - name: 'Set up nx cache'
      uses: myparcelnl/actions/nx-cache@v6
      if: steps.nx.outcome == 'success'

    - uses: myparcelnl/actions/pdk-builder@v6
      with:
        command: 'translations'
