name: 'Create custom build'
description: 'Create custom build using specific PDK versions'

inputs:
  php-pdk-ref:
    default: 'main'
    description: 'Ref of myparcelnl/pdk to use'

  js-pdk-ref:
    default: 'main'
    description: 'Ref of myparcelnl/js-pdk to use'

  php-version:
    description: 'PHP version that is used'
    required: false
    default: '7.4'

  php-scoper-version:
    description: 'PHP Scoper Version'
    required: false
    default: '^0.18.0'

  source-files:
    description: 'List of source files to use for caching'
    required: true

  vendor-files:
    description: 'List of files to use for vendor caching'
    required: false
    default: |
      composer.json
      composer.lock
      scoper.inc.php
      scoper.*.inc.php

runs:
  using: composite
  steps:
    - name: 'Determine version'
      id: version
      shell: bash
      env:
        DEBUG: ${{ runner.debug }}
        RUN_ID: ${{ github.run_id }}
      #language=bash
      run: |
        version=$(jq -r .version package.json)
        isPreRelease=$(echo "$version" | grep -E -- '-[a-z]+\.[0-9]+$' || true)

        if [ -n "$isPreRelease" ]; then
          releaseVersion="$version-$RUN_ID"
        else
          releaseVersion="$version-rc.$RUN_ID"
        fi

        if [ $DEBUG == "1" ]; then
          echo "RUN_ID=$RUN_ID"
          echo "isPreRelease=$isPreRelease"
          echo "releaseVersion=$releaseVersion"
          echo "version=$version"
        fi

        echo "version=$releaseVersion" >> $GITHUB_OUTPUT

    - name: 'Link myparcelnl/pdk'
      if: inputs.php-pdk-ref != 'main'
      env:
        REF: ${{ inputs.php-pdk-ref }}
      shell: bash
      #language=bash
      run: |
        jq '.require["myparcelnl/pdk"] = "dev-'$REF'" | ."minimum-stability" = "dev"' composer.json > composer.json.tmp
        mv composer.json.tmp composer.json

    - uses: myparcelnl/actions/pdk-setup@v6
      id: setup
      with:
        composer-command: 'update'
        composer-dev: false
        php-version: ${{ inputs.php-version }}

    - name: 'Checkout myparcelnl/js-pdk'
      if: inputs.js-pdk-ref != 'main'
      uses: actions/checkout@v7
      with:
        path: js-pdk
        repository: myparcelnl/js-pdk
        ref: ${{ inputs.js-pdk-ref }}

    # A link: override does not install the dependencies of the linked package, so install them in js-pdk first.
    - name: 'Link myparcelnl/js-pdk'
      if: inputs.js-pdk-ref != 'main'
      shell: bash
      #language=bash
      run: |
        pnpm install --dir js-pdk --frozen-lockfile

        # pnpm config set replaces the whole object, so merge the overrides the project already has.
        overrides=$(jq -n \
          --argjson current "$(pnpm config get --location project overrides --json)" \
          --arg dir "$GITHUB_WORKSPACE/js-pdk" \
          '($current // {}) + ([
            "apps/admin",
            "apps/admin-component-tests",
            "apps/admin-js",
            "apps/admin-preset-bootstrap4",
            "apps/admin-preset-dashicons",
            "apps/admin-preset-default",
            "apps/admin-preset-fontawesome",
            "apps/checkout",
            "apps/checkout-js",
            "libs/checkout-common",
            "libs/checkout-delivery-options",
            "libs/checkout-separate-address-fields",
            "libs/checkout-tax-fields",
            "libs/common"
          ] | map({key: "@myparcel-dev/pdk-\(split("/")[1])", value: "link:\($dir)/\(.)"}) | from_entries)')

        pnpm config set --location project overrides "$overrides" --json

        pnpm install --no-frozen-lockfile

    - uses: myparcelnl/actions/pdk-cache@v6
      with:
        php-version: ${{ inputs.php-version }}
        php-scoper-version: ${{ inputs.php-scoper-version }}
        source-files: ${{ inputs.source-files }}
        vendor-files: ${{ inputs.vendor-files }}
        vendor-key: update-${{ steps.setup.outputs.composer-flags }}

    - uses: myparcelnl/actions/pdk-release@v6
      with:
        command: 'prerelease'
        image: ${{ steps.setup.outputs.image }}
        version: ${{ steps.version.outputs.version }}

    - name: 'Write summary'
      shell: bash
      env:
        JS_PDK_REF: ${{ inputs.js-pdk-ref }}
        PHP_PDK_REF: ${{ inputs.php-pdk-ref }}
        VERSION: ${{ steps.version.outputs.version }}
        SERVER_URL: ${{ github.server_url }}
      #language=bash
      run: |
        echo "# Build summary"                                                                            >> $GITHUB_STEP_SUMMARY
        echo ""                                                                                           >> $GITHUB_STEP_SUMMARY
        echo "- **Generated version**: $VERSION"                                                          >> $GITHUB_STEP_SUMMARY
        echo "- **myparcelnl/pdk**: [$PHP_PDK_REF]($SERVER_URL/myparcelnl/pdk/commits/$PHP_PDK_REF/)"     >> $GITHUB_STEP_SUMMARY
        echo "- **myparcelnl/js-pdk**: [$JS_PDK_REF]($SERVER_URL/myparcelnl/js-pdk/commits/$JS_PDK_REF/)" >> $GITHUB_STEP_SUMMARY
